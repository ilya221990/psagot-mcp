services:
  - type: web
    name: psagot-mcp-personal
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: ORDERNET_BROKER
        value: psagot
      - key: ORDERNET_USERNAME
        sync: false
      - key: ORDERNET_PASSWORD
        sync: false
      - key: MCP_ACCESS_TOKEN
        generateValue: true
